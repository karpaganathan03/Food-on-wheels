<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="shortcut icon" href="assets/images/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <title>Reset Password — StreetFeast</title>
  <meta name="description" content="Reset your StreetFeast vendor account password to regain access to your food truck command center.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Theme & Responsive Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt min-vh-100 d-flex flex-column justify-content-between p-3 p-md-4">

  <!-- Floating Utility Bar -->
  <div class="d-flex justify-content-between align-items-center auth-page-wrapper mb-2">
    <a href="login.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
      <i class="bi bi-arrow-left"></i> Back to Login
    </a>
    <div class="d-flex align-items-center gap-2">
      <button class="mode-toggle-btn border-0 bg-transparent text-muted small" type="button" aria-label="Toggle Night Market mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="rtl-toggle-btn border-0 bg-transparent text-muted small" type="button" aria-label="Toggle LTR/RTL layout">
        <span>LTR/RTL</span>
      </button>
    </div>
  </div>

  <!-- Centered Form Container -->
  <main class="auth-page-wrapper my-auto py-2">
    <!-- Brand Logo (Universal Standard - Compact) -->
    <div class="text-center mb-3">
      <a class="navbar-brand d-inline-flex align-items-center gap-2.5 text-decoration-none" href="index.html">
        <img class="brand-logo-image" src="assets/images/Logo.png" alt="StreetFeast - Food Truck &amp; Taste">
      </a>
    </div>

    <!-- Standalone Card (Compact) -->
    <div class="auth-card">
      <div class="mb-3 text-center text-sm-start">
        <h3 class="fw-bold mb-1">Reset Password</h3>
        <p class="small text-muted mb-0" style="font-size: 0.82rem;">Enter your email to receive a secure recovery link</p>
      </div>

      <form action="login.html" method="GET" class="needs-validation" novalidate id="form-forgot-password">
        <div class="mb-3">
          <label class="form-label" for="reset-email">Registered Email Address *</label>
          <div class="input-group">
            <span class="input-group-text bg-surface-alt"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="reset-email" placeholder="Enter your registered email" required>
            <div class="invalid-feedback">Valid registered email required.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-brand-primary w-100">
          Send Recovery Link
        </button>
      </form>

      <div class="text-center mt-3 pt-2.5 border-top">
        <p class="small text-muted mb-0" style="font-size: 0.82rem;">Remembered your password? <a href="login.html" class="text-primary-custom fw-bold text-decoration-none">Sign In</a></p>
      </div>
    </div>
  </main>

  <!-- Minimal Copyright Footer -->
  <footer class="text-center py-3 text-muted small">
    &copy; 2026 <strong>StreetFeast</strong>. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
