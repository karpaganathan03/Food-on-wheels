<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Vendor Login — StreetFeast</title>
  <meta name="description" content="Sign in to your StreetFeast Food Truck Vendor Command Center.">
  <meta name="keywords" content="vendor login, food truck dashboard login, streetfeast vendor portal">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Theme & Responsive Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt min-vh-100 d-flex flex-column justify-content-between p-3 p-md-4">

  <!-- Floating Utility Bar -->
  <div class="d-flex justify-content-between align-items-center auth-page-wrapper mb-2">
    <a href="index.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
      <i class="bi bi-arrow-left"></i> Back to StreetFeast
    </a>
    <div class="d-flex align-items-center gap-2">
      <button class="mode-toggle-btn border-0 bg-transparent text-muted small" type="button" aria-label="Toggle Night Market mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <button class="rtl-toggle-btn border-0 bg-transparent text-muted small" type="button" aria-label="Toggle LTR/RTL layout">
        <span>LTR/RTL</span>
      </button>
    </div>
  </div>

  <!-- Centered Form Container -->
  <main class="auth-page-wrapper my-auto py-2">
    <!-- Brand Logo (Universal Standard - Compact) -->
    <div class="text-center mb-3">
      <a class="navbar-brand d-inline-flex align-items-center gap-2.5 text-decoration-none" href="index.html">
        <div class="brand-logo-badge auth-brand-badge">
          <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="url(#sfBrandGradLogin)"/>
            <path d="M10 29V20C10 18.8954 10.8954 18 12 18H28V29H10Z" fill="white"/>
            <path d="M28 20H33.5858C34.3815 20 35.1446 20.3161 35.7071 20.8787L38.1213 23.2929C38.6839 23.8554 39 24.6185 39 25.4142V29H28V20Z" fill="white" fill-opacity="0.9"/>
            <rect x="14" y="21" width="10" height="5" rx="1" fill="#E63946"/>
            <path d="M18 12C18 12 16.5 14 17.5 15.5C18.5 17 20 15 20 15C20 15 21.5 17 20.5 18C19.5 19 18 18.5 18 18.5" stroke="#FFD166" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M29.5 21.5H34.5L36.5 24.5H29.5V21.5Z" fill="#161A1D"/>
            <circle cx="16" cy="30" r="3.5" fill="#161A1D" stroke="white" stroke-width="1.5"/>
            <circle cx="16" cy="30" r="1.2" fill="#E9A820"/>
            <circle cx="32" cy="30" r="3.5" fill="#161A1D" stroke="white" stroke-width="1.5"/>
            <circle cx="32" cy="30" r="1.2" fill="#E9A820"/>
            <defs>
              <linearGradient id="sfBrandGradLogin" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#E63946"/>
                <stop offset="1" stop-color="#E9A820"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text-wrap d-flex flex-column text-start lh-1">
          <span class="brand-title fw-bold fs-4 text-heading auth-brand-title">Street<strong class="text-primary-custom">Feast</strong></span>
          <span class="brand-tagline text-muted" style="font-size: 0.58rem; letter-spacing: 0.14em; font-weight: 800;">FOOD TRUCK &amp; TASTE</span>
        </div>
      </a>
    </div>

    <!-- The Standalone Login Card (Compact & Centered) -->
    <div class="auth-card">
      <div class="mb-3 text-center text-sm-start">
        <h3 class="fw-bold mb-1">Vendor Sign In</h3>
        <p class="small text-muted mb-0" style="font-size: 0.82rem;">Access your food truck command center</p>
      </div>

      <!-- Dynamic Alert Container for Registration Success & Credential Errors -->
      <div id="login-alert-container"></div>

      <form class="needs-validation" novalidate id="form-vendor-login">
        <div class="mb-2.5">
          <label class="form-label" for="vendor-email">Vendor Account Email *</label>
          <div class="input-group">
            <span class="input-group-text bg-surface-alt"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="vendor-email" placeholder="Enter your registered email" required>
            <div class="invalid-feedback">Please enter your email.</div>
          </div>
        </div>

        <div class="mb-2.5">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label mb-0" for="vendor-password">Password *</label>
            <a href="forgot-password.html" class="small text-primary-custom text-decoration-none" style="font-size: 0.78rem;">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-surface-alt"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="vendor-password" placeholder="Enter your password" required>
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember-me" checked>
          <label class="form-check-label small" for="remember-me" style="font-size: 0.8rem;">Remember this device</label>
        </div>

        <button type="submit" class="btn btn-brand-primary w-100" id="btn-login-submit">
          Login to Command Center
        </button>
      </form>

      <div class="text-center mt-3 pt-2.5 border-top">
        <p class="small text-muted mb-0" style="font-size: 0.82rem;">
          Don't have a vendor listing yet? <a href="vendor-signup.html" class="text-primary-custom fw-bold text-decoration-none">Create Account</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Minimal Copyright Footer -->
  <footer class="text-center py-3 text-muted small">
    &copy; 2026 <strong>StreetFeast</strong>. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
